name: CI/CD Pipeline

on:
  push:
    branches:
      - kiii-project
  pull_request:
    branches:
      - kiii-project

jobs:
  build-and-push:
    name: Build & Push Docker Images to DockerHub
    runs-on: ubuntu-latest

    env:
      FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/gourmet-frontend
      BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/gourmet-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Git config for committing
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Docker image tag to Git commit SHA
        id: tag
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./gourmet-greet-frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}

      - name: Update frontend image tag in manifest
        run: |
          sed -i "s|image: .*/gourmet-frontend:.*|image: ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}|g" k8s/frontend-deployment.yaml

      - name: Update backend image tag in manifest
        run: |
          sed -i "s|image: .*/gourmet-backend:.*|image: ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}|g" k8s/backend-deployment.yaml

      - name: Commit and push updated manifests
        run: |
          git add k8s/frontend-deployment.yaml k8s/backend-deployment.yaml
          git commit -m "chore: update image tags to ${{ env.TAG }}" || echo "No changes to commit"
          git push origin kiii-project
