<h2 mat-dialog-title class="dialog-title">Request Upgrade to Chef</h2>

<mat-dialog-content>
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Message to Gourmet Greet</mat-label>
    <textarea matInput [(ngModel)]="message" rows="5" placeholder="Enter your message here..."></textarea>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions">
  <button mat-stroked-button color="warn" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="submitRequest()" [disabled]="!message">Submit</button>
</mat-dialog-actions>
